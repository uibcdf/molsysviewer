name: Python 3.14 source pair

# Feasibility gate for Python, notebooks and core browser workflows on the
# coordinated source branches. It does not establish
# resolver-consistent package installation or authorize a public Python badge.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-python-314-source-pair.yaml
      - devtools/conda-envs/test_source_pair_py314.yaml
      - devtools/audit_dependency_contract.py
      - devtools/dependency_contract.toml
      - pyproject.toml
      - molsysviewer/**
      - tests/**
      - docs/**
  workflow_dispatch:
    inputs:
      molsysmt_sha:
        description: Full MolSysMT source candidate commit SHA
        required: true
        type: string
      molsysmt_version:
        description: Intended MolSysMT version at the exact source candidate
        required: true
        default: 0.23.0
        type: string
      viewer_version:
        description: Intended Viewer release version for the exact source candidate
        required: true
        default: 0.24.0
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-python-314-source-pair.yaml
      - devtools/conda-envs/test_source_pair_py314.yaml
      - devtools/audit_dependency_contract.py
      - devtools/dependency_contract.toml
      - pyproject.toml
      - molsysviewer/**
      - tests/**
      - docs/**

permissions:
  contents: read

jobs:
  source-pair:
    name: Source pair on ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-15,  python-version: "3.14" }
          - { os: windows-2025, python-version: "3.14" }

    steps:
      - name: Check out MolSysViewer
        uses: actions/checkout@v4
        with:
          path: molsysviewer-source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the exact MolSysMT source candidate
        uses: actions/checkout@v4
        with:
          repository: uibcdf/molsysmt
          # Exact source baseline for Interactions/H5MSM and mixed-source loading.
          # Source feasibility does not establish a compatible published package.
          ref: ${{ inputs.molsysmt_sha || '46ef28eb60a258aa77d82ff1bc39ee0d1591e3c9' }}
          path: molsysmt-source
          fetch-depth: 0
          persist-credentials: false

      - name: Require an exact MolSysMT commit
        shell: bash
        env:
          MOLSYSMT_SHA: ${{ inputs.molsysmt_sha || '46ef28eb60a258aa77d82ff1bc39ee0d1591e3c9' }}
        run: |
          [[ "$MOLSYSMT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C molsysmt-source rev-parse HEAD)" = "$MOLSYSMT_SHA"

      - name: Select MolSysMT's pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version

      - name: Create the Python 3.14 source-pair environment
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: molsysviewer-source/devtools/conda-envs/test_source_pair_py314.yaml
          environment-name: source-pair
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict

      - name: Validate and locally tag the exact Viewer source candidate
        id: viewer-candidate-tag
        shell: bash -l {0}
        working-directory: molsysviewer-source
        env:
          EXPECTED_VERSION: ${{ inputs.viewer_version || '0.24.0' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python devtools/validate_python_wheel_runtime.py --expected-version "$EXPECTED_VERSION"
          if git show-ref --verify --quiet "refs/tags/$EXPECTED_VERSION"; then
            test "$(git rev-list -n 1 "$EXPECTED_VERSION")" = "$GITHUB_SHA"
          else
            git tag "$EXPECTED_VERSION" HEAD
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Locally tag the exact MolSysMT candidate version
        id: provider-candidate-tag
        shell: bash -l {0}
        working-directory: molsysmt-source
        env:
          EXPECTED_VERSION: ${{ inputs.molsysmt_version || '0.23.0' }}
          MOLSYSMT_SHA: ${{ inputs.molsysmt_sha || '46ef28eb60a258aa77d82ff1bc39ee0d1591e3c9' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$MOLSYSMT_SHA"
          if git show-ref --verify --quiet "refs/tags/$EXPECTED_VERSION"; then
            test "$(git rev-list -n 1 "$EXPECTED_VERSION")" = "$MOLSYSMT_SHA"
          else
            git tag "$EXPECTED_VERSION" HEAD
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install both exact source candidates
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python -m pip install --no-deps --no-build-isolation ./molsysmt-source
          python -m pip install --no-deps --no-build-isolation ./molsysviewer-source
          python -m pip check

      - name: Remove the temporary Viewer tag after installation
        if: always() && steps.viewer-candidate-tag.outputs.created == 'true'
        shell: bash -l {0}
        working-directory: molsysviewer-source
        env:
          EXPECTED_VERSION: ${{ inputs.viewer_version || '0.24.0' }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$EXPECTED_VERSION")" = "$GITHUB_SHA"
          git tag -d "$EXPECTED_VERSION"

      - name: Remove the temporary MolSysMT tag after installation
        if: always() && steps.provider-candidate-tag.outputs.created == 'true'
        shell: bash -l {0}
        working-directory: molsysmt-source
        env:
          EXPECTED_VERSION: ${{ inputs.molsysmt_version || '0.23.0' }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$EXPECTED_VERSION")" = "$(git rev-parse HEAD)"
          git tag -d "$EXPECTED_VERSION"

      - name: Audit dependency routes and the installed exact source provider
        shell: bash -l {0}
        working-directory: molsysviewer-source
        env:
          MOLSYSMT_SHA: ${{ inputs.molsysmt_sha || '46ef28eb60a258aa77d82ff1bc39ee0d1591e3c9' }}
        run: |
          python devtools/audit_dependency_contract.py \
            --installed-source "molsysmt=../molsysmt-source@$MOLSYSMT_SHA"

      - name: Check installed Rust and viewer resources
        shell: bash -l {0}
        run: |
          set -euo pipefail
          python molsysmt-source/devtools/scripts/validate_installed_rust_extension.py
          python -c "from importlib.resources import files; assert files('molsysviewer').joinpath('viewer.js').is_file(); assert files('molsysviewer').joinpath('runtime_actions.json').is_file()"

      - name: Record published pytest tool versions
        shell: bash -l {0}
        run: |
          python -c "import sys; from importlib.metadata import version; print(sys.version); print('pytest', version('pytest')); print('pytest-receptor', version('pytest-receptor')); assert version('pytest-receptor') == '1.2.0'"

      - name: Guard native MolSysMT paths in the installed pair
        shell: bash -l {0}
        run: python -m pytest -o receptor_rerun_command="python -m pytest" --receptor=ci molsysmt-source/tests/basic/test_get_form.py::test_bundled_path_is_detected_and_converted_on_native_platform

      - name: Test MolSysMT integration against the installed pair
        shell: bash -l {0}
        env:
          MOLSYSVIEWER_TEST_INSTALLED: "1"
        run: python -m pytest -o receptor_rerun_command="python -m pytest" --receptor=ci --import-mode=importlib molsysviewer-source/tests/integration/test_molsysmt_integration.py

      - name: Install JavaScript test dependencies
        shell: bash -l {0}
        working-directory: molsysviewer-source/molsysviewer/js
        run: npm ci

      - name: Run MolSysViewer Python tests
        shell: bash -l {0}
        working-directory: molsysviewer-source
        run: python -m pytest -o receptor_rerun_command="python -m pytest" --receptor=ci tests/

      # Keep the published/staging notebook and E2E gates independent. This
      # Linux source observation supplies the coordinated development handoff;
      # it cannot satisfy an installed-artifact or public release gate (#170).
      - name: Register the exact source-pair notebook kernel
        id: notebook-kernel
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: python -m ipykernel install --sys-prefix --name python3 --display-name "Python source pair 3.14"

      - name: Build the source-pair browser runtime and harness
        if: runner.os == 'Linux'
        shell: bash -l {0}
        working-directory: molsysviewer-source/molsysviewer/js
        run: |
          npm run build:runtime
          npm run build:harness
          npm run build:e2e:all

      - name: Verify the hosted source-pair browser
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version

      - name: Run all core browser suites against the exact source pair
        if: runner.os == 'Linux'
        shell: bash -l {0}
        working-directory: molsysviewer-source/molsysviewer/js
        env:
          PW_CHROMIUM_BIN: /usr/bin/google-chrome
        run: npm run test:e2e:core

      - name: Execute every documented notebook against the exact source pair
        if: always() && runner.os == 'Linux' && steps.notebook-kernel.outcome == 'success'
        shell: bash -l {0}
        working-directory: molsysviewer-source
        run: python docs/execute_notebooks.py -q -n 4 -r -f docs/content

      - name: Preserve source-pair notebook failure logs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: source-pair-notebook-failure-logs
          path: |
            molsysviewer-source/docs/notebook_errors.log
            molsysviewer-source/docs/content/**/*.nbconvert.log
          if-no-files-found: ignore
