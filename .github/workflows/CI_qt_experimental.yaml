name: Experimental Qt diagnostics

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - '**/*.ipynb'
      - 'docs/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * MON"
    - cron: "47 0 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      use_staging:
        description: Exercise the experimental host against a staged provider
        required: true
        default: false
        type: boolean
      molsysmt_version:
        description: Exact staged MolSysMT version when use_staging is true
        required: true
        default: 0.23.0
        type: string
      viewer_version:
        description: Exact Viewer source version when use_staging is true
        required: true
        default: 0.24.1
        type: string
      probe_backlog:
        description: Inspect only the experimental Qt backlog
        required: false
        default: false
        type: boolean

jobs:
  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 0 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to run experimental Qt diagnostics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/ci_backlog.py --lane qt

  qt-pipeline:
    # Experimental diagnostics retain their official failure conclusions.
    # They do not qualify the core or certify a visible native-GPU host.
    # Runs the two Qt observations that had been reported as impossible without a screen.
    # They are not: under Xvfb with software WebGL both complete, which nobody had tried
    # since the 2026-08-09 attempt to attach to a real display failed on X authorization.
    #
    # **What this establishes and what it does not.** These assert that the Qt pipeline
    # *completes* -- the bridge becomes ready, the payload is served over the custom
    # scheme, and the structure finishes loading through a real WebGL context. Nothing
    # reads the framebuffer. uibcdf/molsysviewer#64 is the standing proof that completion
    # and correctness are different questions: every atom arrived, the load finished, and
    # fifty-nine of sixty protein copies were missing from the picture.
    #
    # So this job does not close Phase 7's item in `devguide/what_needs_a_human_2026_08.md`
    # and must never be recorded as the human observation. It catches a Qt host that is
    # broken outright, which until now nothing did.
    name: Qt pipeline completes (Xvfb, software WebGL)
    needs: nightly-decision
    if: >-
      !cancelled() && inputs.probe_backlog != true
      && (needs.nightly-decision.result != 'success' || needs.nightly-decision.outputs.run_full == 'true')
      && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup conda env with the Qt stack
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        environment-file: devtools/conda-envs/test_env.yaml
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
            - ambermd
          channel_priority: strict
        create-args: >-
          python=3.13
          pyside6=6.11.2
          qt6-webengine=6.11.2
          qt6-positioning=6.11.2
          ${{ inputs.use_staging && '--override-channels --channel uibcdf/label/staging --channel uibcdf --channel conda-forge --channel ambermd' || '' }}
          ${{ inputs.use_staging && format('molsysmt={0}', inputs.molsysmt_version) || '' }}

    - name: Validate and locally tag the staged Viewer candidate
      id: viewer-candidate-tag
      if: github.event_name == 'workflow_dispatch' && inputs.use_staging
      shell: bash -l {0}
      env:
        EXPECTED_VERSION: ${{ inputs.viewer_version }}
      run: |
        set -euo pipefail
        [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python devtools/validate_python_wheel_runtime.py --expected-version "$EXPECTED_VERSION"
        if git show-ref --verify --quiet "refs/tags/$EXPECTED_VERSION"; then
          test "$(git rev-list -n 1 "$EXPECTED_VERSION")" = "$GITHUB_SHA"
        else
          git tag "$EXPECTED_VERSION" HEAD
          echo "created=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Record published pytest tool versions
      shell: bash -l {0}
      run: |
        python -c "import sys; from importlib.metadata import version; print(sys.version); print('pytest', version('pytest')); print('pytest-receptor', version('pytest-receptor')); assert version('pytest-receptor') == '1.2.0'"

    - name: Install package
      id: install-viewer
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps

    - name: Remove the temporary Viewer tag after installation
      if: always() && steps.viewer-candidate-tag.outputs.created == 'true'
      shell: bash -l {0}
      env:
        EXPECTED_VERSION: ${{ inputs.viewer_version }}
      run: |
        set -euo pipefail
        test "$(git rev-list -n 1 "$EXPECTED_VERSION")" = "$GITHUB_SHA"
        git tag -d "$EXPECTED_VERSION"

    - name: Xvfb and the software GL stack
      id: configure-gl
      shell: bash -l {0}
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgl1 libegl1

    - name: Qt transport round-trip in a real Qt process
      if: ${{ !cancelled() && steps.install-viewer.outcome == 'success' && steps.configure-gl.outcome == 'success' }}
      shell: bash -l {0}
      run: |
        xvfb-run -a python -m pytest -o receptor_rerun_command="python -m pytest" --receptor=ci -m qt_runtime -k qt_live_model_smoke_real_window --junitxml=qt-window.xml -v --no-header

    - name: The structure finishes loading through WebGL
      if: ${{ !cancelled() && steps.install-viewer.outcome == 'success' && steps.configure-gl.outcome == 'success' }}
      shell: bash -l {0}
      env:
        MOLSYSVIEWER_QT_GPU_TEST: "1"
        QTWEBENGINE_CHROMIUM_FLAGS: "--use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader"
      run: |
        xvfb-run -a python -m pytest -o receptor_rerun_command="python -m pytest" --receptor=ci -m qt_runtime -k full_render_gpu --junitxml=qt-render.xml -v --no-header

    - name: Qt offscreen transport and resource probes
      if: ${{ !cancelled() && steps.install-viewer.outcome == 'success' && steps.configure-gl.outcome == 'success' }}
      shell: bash -l {0}
      run: |
        xvfb-run -a python -m pytest -m qt_runtime -k "not qt_live_model_smoke_real_window and not full_render_gpu" -o receptor_rerun_command="python -m pytest" --receptor=ci --junitxml=qt-probes.xml

    - name: Preserve experimental Qt results
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: experimental-qt-results
        path: |
          qt-window.xml
          qt-render.xml
          qt-probes.xml
        if-no-files-found: warn
        retention-days: 14
