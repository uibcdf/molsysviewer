name: Promote an exact conda package

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the published release
        required: true
        type: string
      version:
        description: Three-part release version
        required: true
        type: string
      build_number:
        description: Exact validated staging build number
        required: true
        type: number
      sha256:
        description: Independently verified staging artifact SHA-256
        required: true
        type: string
      pair_run_id:
        description: Successful MolSysMT installed-pair validation run ID
        required: true
        type: string
      molsysmt_candidate_sha:
        description: Full MolSysMT commit SHA of that validation run
        required: true
        type: string
      molsysmt_version:
        description: Exact MolSysMT version in that installed-pair run
        required: true
        type: string
      molsysmt_build_number:
        description: Exact MolSysMT build in that installed-pair run
        required: true
        type: number

permissions:
  contents: read
  actions: read

concurrency:
  group: molsysviewer-conda-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote the digest-verified noarch file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Validate release identity and installed-pair gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MOLSYSMT_CANDIDATE_SHA: ${{ inputs.molsysmt_candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          PAIR_RUN_ID: ${{ inputs.pair_run_id }}
          MOLSYSMT_VERSION: ${{ inputs.molsysmt_version }}
          MOLSYSMT_BUILD: ${{ inputs.molsysmt_build_number }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MOLSYSMT_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PAIR_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$MOLSYSMT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$MOLSYSMT_BUILD" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq .draft)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq .prerelease)" = false
          python devtools/conda-build/release_route.py \
            --version "$RELEASE_VERSION" --event release \
            --github-output "$RUNNER_TEMP/conda-route-output"
          test "$(gh api "repos/uibcdf/molsysmt/actions/runs/$PAIR_RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/uibcdf/molsysmt/actions/runs/$PAIR_RUN_ID" --jq .head_sha)" = "$MOLSYSMT_CANDIDATE_SHA"
          run_path="$(gh api "repos/uibcdf/molsysmt/actions/runs/$PAIR_RUN_ID" --jq .path)"
          [[ "$run_path" == .github/workflows/validate_conda_staging.yaml* ]]
          test "$(gh api "repos/uibcdf/molsysmt/actions/runs/$PAIR_RUN_ID/jobs?per_page=100" --jq .total_count)" = 21
          expected_run_title="MT $MOLSYSMT_VERSION build $MOLSYSMT_BUILD + Viewer $RELEASE_VERSION build $BUILD_NUMBER | Python 3.14 | all"
          test "$(gh api "repos/uibcdf/molsysmt/actions/runs/$PAIR_RUN_ID" --jq .display_title)" = "$expected_run_title"

      - name: Set up the authenticated Anaconda client
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: promote
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Promote the exact staged artifact
        id: promotion
        uses: uibcdf/action-build-and-upload-conda-packages/promote@v2.2.2
        with:
          package-spec: uibcdf/molsysviewer/${{ inputs.version }}/noarch/molsysviewer-${{ inputs.version }}-py_${{ inputs.build_number }}.tar.bz2
          expected-sha256: ${{ inputs.sha256 }}
          from-label: staging
          to-label: main
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}

      - name: Retain the bounded promotion receipt
        if: ${{ always() && steps.promotion.outputs.receipt != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molsysviewer-conda-promotion-${{ inputs.version }}-py_${{ inputs.build_number }}
          path: ${{ steps.promotion.outputs.receipt }}
          if-no-files-found: error
          retention-days: 30

      - name: Independently verify the public package record
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          python3 devtools/conda-build/verify_public_package.py \
            --package molsysviewer \
            --version "$RELEASE_VERSION" \
            --subdir noarch \
            --filename "molsysviewer-${RELEASE_VERSION}-py_${BUILD_NUMBER}.tar.bz2" \
            --sha256 "$EXPECTED_SHA256"
