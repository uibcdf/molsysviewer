name: CI_e2e

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 0 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      use_staging:
        description: Test the coordinated MolSysMT/MolSysViewer candidates from staging
        required: true
        default: false
        type: boolean
      molsysmt_version:
        description: Exact staged MolSysMT version when use_staging is true
        required: true
        default: 0.22.4
        type: string
      e2e_lane:
        description: Core 1.0 gate or post-1.0 remote diagnostics
        required: true
        default: core
        type: choice
        options:
          - core
          - remote-portable
      probe_backlog:
        description: Check skipped-commit debt without running core E2E
        required: false
        default: false
        type: boolean

jobs:
  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '27 0 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to run core E2E
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/ci_backlog.py --lane e2e

  e2e:
    name: Core E2E
    needs: nightly-decision
    runs-on: ubuntu-latest
    if: >-
      always() && inputs.probe_backlog != true
      && (needs.nightly-decision.result != 'success' || needs.nightly-decision.outputs.run_full == 'true')
      && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The suite needs the Python package, not only Node: `npm run build` reads
      # `molsysviewer/_version.py`, which exists only once the package is installed, and
      # a third of the scenarios drive the page from a Python bridge. Without this the
      # job stopped at `ENOENT ... _version.py` on every run (uibcdf/molsysviewer#88).
      # The environment also provides Node, as it does for the JS step in CI.yaml.
      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: >-
            python=3.13
            ${{ inputs.use_staging && '--override-channels --channel uibcdf/label/staging --channel uibcdf --channel conda-forge --channel ambermd' || '' }}
            ${{ inputs.use_staging && format('molsysmt={0}', inputs.molsysmt_version) || '' }}

      - name: Install package
        shell: bash -l {0}
        run: python -m pip install . --no-deps

      - name: Install JS deps
        working-directory: molsysviewer/js
        shell: bash -l {0}
        run: npm ci

      - name: Build harness and bundle
        working-directory: molsysviewer/js
        shell: bash -l {0}
        run: |
          npm run build
          npm run build:harness
          npm run build:e2e:all

      # The E2E harness selects /usr/bin/google-chrome by default. The hosted
      # Ubuntu image provides it; downloading a second Chromium copy stalled
      # during ZIP extraction before any tests could begin (#88).
      - name: Verify hosted Chrome
        shell: bash -l {0}
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version

      # The 1.0 gate covers the local/core browser product. The three remote
      # preview suites remain runnable in the portable and server-gpu lanes,
      # but their certification belongs to post-1.0 (#100). Core still fails
      # on browser or WebGL problems rather than silently skipping them.
      - name: Run core E2E tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e_lane == 'core' }}
        working-directory: molsysviewer/js
        shell: bash -l {0}
        env:
          PW_CHROMIUM_BIN: /usr/bin/google-chrome
        run: npm run test:e2e:core

      - name: Run remote preview E2E diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_lane == 'remote-portable' }}
        working-directory: molsysviewer/js
        shell: bash -l {0}
        env:
          PW_CHROMIUM_BIN: /usr/bin/google-chrome
        run: npm run test:e2e:remote-portable
