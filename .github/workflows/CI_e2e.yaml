name: CI_e2e

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: >
      !(
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]'))
        ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]'))
        ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'skip-ci'))
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The suite needs the Python package, not only Node: `npm run build` reads
      # `molsysviewer/_version.py`, which exists only once the package is installed, and
      # a third of the scenarios drive the page from a Python bridge. Without this the
      # job stopped at `ENOENT ... _version.py` on every run (uibcdf/molsysviewer#88).
      # The environment also provides Node, as it does for the JS step in CI.yaml.
      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Install package
        shell: bash -l {0}
        run: python -m pip install . --no-deps

      - name: Install JS deps
        working-directory: molsysviewer/js
        shell: bash -l {0}
        run: npm ci

      - name: Build harness and bundle
        working-directory: molsysviewer/js
        shell: bash -l {0}
        run: |
          npm run build
          npm run build:harness
          npm run build:e2e:all

      - name: Install Playwright browsers
        working-directory: molsysviewer/js
        shell: bash -l {0}
        run: npx playwright install chromium

      - name: Run E2E tests
        working-directory: molsysviewer/js
        shell: bash -l {0}
        run: npm run test:e2e
