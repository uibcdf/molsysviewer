name: npm-publish.yaml

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión exacta a publicar (ej. 0.5.3)"
        required: true
        default: "0.5.3"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Permisos críticos para Trusted Publishing (OIDC)
    permissions:
      contents: read
      id-token: write 
    
    defaults:
      run:
        working-directory: molsysviewer/js

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install latest npm
        # Necesario para que el CLI soporte Trusted Publishing nativo (v11.5.1+)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build runtime bundle
        run: npm run build

      - name: Verify tag matches package version
        env:
          # Usamos el input del manual dispatch o el nombre del tag del release
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node - <<'NODE'
          const tag = (process.env.TAG || "").replace(/^v/, "");
          
          // Validación de seguridad para no publicar con versión "main"
          if (tag === "main" || tag === "master") {
            console.error("Error: Estás intentando publicar desde la rama '" + tag + "'.");
            console.error("Debes especificar una versión numérica (ej. 0.5.3) en el input del workflow.");
            process.exit(1);
          }

          const pkg = require("./package.json");
          if (pkg.version !== tag) {
            console.error(`Error: El tag/input (${tag}) no coincide con la versión en package.json (${pkg.version})`);
            process.exit(1);
          }
          console.log(`Versión validada: ${tag}`);
          NODE

      - name: Publish to npm
        run: |
          # Limpiamos cualquier configuración residual del entorno
          rm -f .npmrc ~/.npmrc
          # Publicamos. npm v11 detectará automáticamente el OIDC de GitHub.
          # Nota: --provenance se genera automáticamente en npm 11 con OIDC, 
          # pero puedes dejarlo para mayor seguridad.
          npm publish --access public --provenance
