name: npm-publish.yaml

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión exacta a publicar (ej. 0.5.3)"
        required: true
        default: "0.5.3"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Añadimos 'contents: write' para poder subir los cambios al repo
    permissions:
      contents: write
      id-token: write 
    
    defaults:
      run:
        working-directory: molsysviewer/js

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Importante: para hacer commit de vuelta, necesitamos el historial
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Inject version into package.json
        id: get_version
        run: |
          RAW_VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//')
          
          if [[ "$CLEAN_VERSION" == "main" || "$CLEAN_VERSION" == "master" ]]; then
            echo "ERROR: Versión inválida."
            exit 1
          fi
          
          npm version $CLEAN_VERSION --no-git-tag-version
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Build runtime bundle
        run: npm run build
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}

      - name: Publish to npm
        run: |
          rm -f .npmrc ~/.npmrc
          npm publish --access public --provenance

      # PASO NUEVO: Hacer commit de la versión actualizada al repositorio
      - name: Commit updated package.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update version to ${{ steps.get_version.outputs.version }} [skip ci]"
          file_pattern: 'molsysviewer/js/package.json'
          branch: main # O la rama donde quieras que se actualice
