name: npm-publish.yaml

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g., 0.5.3 or v0.5.3)"
        required: true
        default: "0.5.3"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Permisos necesarios para Trusted Publishing (OIDC)
    permissions:
      contents: read
      id-token: write 
    
    env:
      RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
    
    defaults:
      run:
        working-directory: molsysviewer/js

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # IMPORTANTE: No incluimos registry-url para que no bloquee el flujo OIDC

      - name: Install dependencies
        run: npm ci

      - name: Build runtime bundle
        run: npm run build

      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node - <<'NODE'
          const tag = (process.env.TAG || "").replace(/^v/, "");
          const pkg = require("./package.json");
          if (pkg.version !== tag) {
            throw new Error(`Tag ${tag} does not match package.json version ${pkg.version}`);
          }
          NODE

      - name: Publish to npm
        # No se requiere NODE_AUTH_TOKEN. npm usará el permiso id-token: write
        # para autenticarse automáticamente con el "Trusted Publisher".
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/
