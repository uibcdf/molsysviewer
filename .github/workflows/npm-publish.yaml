name: npm-publish.yaml

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish"
        required: true
        default: "0.5.3"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
    
    defaults:
      run:
        working-directory: molsysviewer/js

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Usamos una versión más reciente de Node

      - name: Install latest npm
        # ESTO ES NECESARIO: Trusted Publishing requiere npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build runtime bundle
        run: npm run build

      - name: Publish to npm
        run: |
          # Eliminamos cualquier config que setup-node haya creado por defecto
          rm -f .npmrc ~/.npmrc
          # Publicamos. Con npm v11+, detectará el OIDC de GitHub automáticamente
          npm publish --access public
