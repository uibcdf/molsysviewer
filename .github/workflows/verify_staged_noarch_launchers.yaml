name: Verify staged noarch launchers

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the staged candidate
        required: true
        type: string
      version:
        description: Exact staged version
        required: true
        type: string
      build_number:
        description: Exact staged build number
        required: true
        type: number
      sha256:
        description: SHA-256 from the staging producer receipt
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-launchers:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Install the exact staged Conda package
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: candidate
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: flexible
          create-args: >-
            python=3.13
            uibcdf/label/staging::molsysviewer=${{ inputs.version }}=py_${{ inputs.build_number }}
      - name: Verify the package and launchers outside the source checkout
        shell: bash -l {0}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          checker="$GITHUB_WORKSPACE/devtools/conda-build/verify_noarch_launchers.py"
          cd "$(cygpath -u "$RUNNER_TEMP")"
          python "$checker" --prefix "$CONDA_PREFIX" \
            --version "$EXPECTED_VERSION" --build-number "$BUILD_NUMBER" \
            --sha256 "$EXPECTED_SHA256"
