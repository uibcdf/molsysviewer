name: Publish NPM Package

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: molsysviewer/js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build runtime bundle
        run: npm run build

      - name: Verify tag matches package version
        run: node -e "const tag=(process.env.GITHUB_REF_NAME||'').replace(/^v/,'');const pkg=require('./package.json');if(pkg.version!==tag){throw new Error(`Tag ${tag} does not match package.json version ${pkg.version}`)}"

      - name: Publish to npm
        run: npm publish --access public --provenance
