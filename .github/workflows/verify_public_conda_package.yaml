name: Verify one public conda package (read-only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published three-part version
        required: true
        type: string
      build_number:
        description: Exact public noarch build number
        required: true
        type: number
      sha256:
        description: Expected immutable SHA-256 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify public label and solver-visible index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact public file without promotion
        id: public_verification
        uses: uibcdf/molsyssuite/.github/actions/verify-public-conda@399d33a4ee0da148571cba7cfc004e3f3a2e71e7
        with:
          package: molsysviewer
          version: ${{ inputs.version }}
          subdir: noarch
          filename: molsysviewer-${{ inputs.version }}-py_${{ inputs.build_number }}.tar.bz2
          sha256: ${{ inputs.sha256 }}

      - name: Retain independent public verification evidence
        if: ${{ always() && steps.public_verification.outputs.evidence-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: molsysviewer-independent-public-conda-${{ inputs.version }}
          path: ${{ steps.public_verification.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

  windows-launchers:
    name: Verify public Windows launchers from the installed package
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the exact public Conda package
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: candidate
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: flexible
          create-args: >-
            python=3.13
            uibcdf::molsysviewer=${{ inputs.version }}=py_${{ inputs.build_number }}
      - name: Verify installed record and commands outside the checkout
        shell: bash -l {0}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          checker="$GITHUB_WORKSPACE/devtools/conda-build/verify_noarch_launchers.py"
          cd "$(cygpath -u "$RUNNER_TEMP")"
          python "$checker" --prefix "$CONDA_PREFIX" \
            --version "$EXPECTED_VERSION" --build-number "$BUILD_NUMBER" \
            --sha256 "$EXPECTED_SHA256" --label main
