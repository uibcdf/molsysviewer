name: Build and upload conda packages

on:
  # Deliberately a Release, not a tag — unlike `npm-publish.yaml`. A tag is a
  # checkpoint in this project's history and there are many; a conda package is
  # something people install, and not every checkpoint should become one. The
  # trigger here was briefly changed to `push: tags` on 2026-08-05 while fixing
  # npm's, and reverted the same day: the two publish different things to
  # different audiences and the cadence is a choice, not an oversight.
  release:
    types: ['released', 'prereleased']

  workflow_dispatch:

jobs:
  conda_deployment_with_new_tag:
    name: Conda deployment of the noarch package
    runs-on: ubuntu-latest
    env:
      # `release.tag_name` is empty on anything that is not a release event, which
      # made the manual path build a package with no version at all.
      RELEASE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
    # No interpreter matrix since 2026-09-02: the recipe is `noarch: python`, so the
    # build produces one artefact that serves every interpreter and platform. Running the
    # matrix would build the same file three times and upload it three times.
    #
    # The interpreter below is only what the build itself runs on. The published package
    # constrains `python >=3.11` from the recipe, not from this line.

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate build
          micromamba info
          micromamba list

      - name: Build and upload the conda packages
        uses: uibcdf/action-build-and-upload-conda-packages@v2.0.1
        with:
          meta_yaml_dir: devtools/conda-build
          mambabuild: false
          user: uibcdf
          label: main
          conda_build_args: --package-format tar.bz2
          # No per-platform conversion: the recipe is `noarch: python`, so conda build
          # writes one artefact under `noarch/` that is already valid everywhere.
          # Converting it would upload duplicates of the same file into subdirectories
          # nobody needs to look in.
          #
          # `platform_host` is deliberately left at its default of true -- it is what
          # keeps the built artefact instead of deleting it after conversion, and with
          # every conversion flag false it is the only thing that gets uploaded.
          platform_linux-64: false
          platform_osx-64: false
          platform_osx-arm64: false
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }} # Replace with the right name of your secret
