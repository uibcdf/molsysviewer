name: Build and upload conda packages

on:
  # Deliberately a Release, not a tag — unlike `npm-publish.yaml`. A tag is a
  # checkpoint in this project's history and there are many; a conda package is
  # something people install, and not every checkpoint should become one. The
  # trigger here was briefly changed to `push: tags` on 2026-08-05 while fixing
  # npm's, and reverted the same day: the two publish different things to
  # different audiences and the cadence is a choice, not an oversight.
  release:
    types: ['released']

  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to build into the staging label
        required: true
        type: string
      version:
        description: New candidate version (for example, 0.23.1)
        required: true
        type: string
      build_number:
        description: Staging build number; increment only to supersede a defective artifact
        required: true
        default: 1
        type: number

permissions:
  contents: read

jobs:
  conda_deployment_with_new_tag:
    name: Conda deployment of the noarch package
    runs-on: ubuntu-latest
    # No interpreter matrix since 2026-09-02: the recipe is `noarch: python`, so the
    # build produces one artefact that serves every interpreter and platform. Running the
    # matrix would build the same file three times and upload it three times.
    #
    # The interpreter below is only what the build itself runs on. The published package
    # constrains `python >=3.11` from the recipe, not from this line.

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.event.release.tag_name }}

      - name: Validate the immutable candidate identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$CANDIDATE_SHA"
          else
            git tag "$RELEASE_VERSION" HEAD
          fi

      - name: Validate the release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_VERSION")"

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate build
          micromamba info
          micromamba list

      - name: Verify the derived package version
        shell: bash -l {0}
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: test "$(python -m versioningit)" = "$EXPECTED_VERSION"

      # MolSysMT 0.22.0 is already present in staging as the one unavoidable bootstrap
      # package. Unlike that first half of the cycle, this package can run its recipe
      # test: conda-build places the just-built MolSysViewer package in the test channel,
      # where it closes the dependency loop with staged MolSysMT.
      - name: Build, test, and upload the staging candidate
        id: conda_staging
        if: github.event_name == 'workflow_dispatch'
        uses: uibcdf/action-build-and-upload-conda-packages@v2.1.0
        env:
          MOLSYSVIEWER_CONDA_BUILD_NUMBER: ${{ inputs.build_number }}
        with:
          meta_yaml_dir: devtools/conda-build
          mambabuild: false
          user: uibcdf
          label: staging
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
          conda_build_args: --package-format tar.bz2
          platform_linux-64: false
          platform_osx-64: false
          platform_osx-arm64: false

      - name: Build, test, and upload the released package
        id: conda_release
        if: github.event_name == 'release'
        uses: uibcdf/action-build-and-upload-conda-packages@v2.1.0
        env:
          MOLSYSVIEWER_CONDA_BUILD_NUMBER: 2
        with:
          meta_yaml_dir: devtools/conda-build
          mambabuild: false
          user: uibcdf
          label: main
          conda_build_args: --package-format tar.bz2
          # No per-platform conversion: the recipe is `noarch: python`, so conda build
          # writes one artefact under `noarch/` that is already valid everywhere.
          # Converting it would upload duplicates of the same file into subdirectories
          # nobody needs to look in.
          #
          # `platform_host` is deliberately left at its default of true -- it is what
          # keeps the built artefact instead of deleting it after conversion, and with
          # every conversion flag false it is the only thing that gets uploaded.
          platform_linux-64: false
          platform_osx-64: false
          platform_osx-arm64: false
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }} # Replace with the right name of your secret

      - name: Upload staging producer evidence
        if: ${{ always() && steps.conda_staging.outputs.evidence_path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.conda_staging.outputs.evidence_artifact_name }}
          path: ${{ steps.conda_staging.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload release producer evidence
        if: ${{ always() && steps.conda_release.outputs.evidence_path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.conda_release.outputs.evidence_artifact_name }}
          path: ${{ steps.conda_release.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
