name: CI

on:
  # GitHub has started calling new repo's first branch "main" https://github.com/github/renaming
  # Existing codes likely still have "master" as the primary branch
  # Both are tracked here to keep legacy and new codes working
  push:
    branches:
      - "main"
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - '**/*.ipynb'
      - '**/*.yml'
      - '**/*.yaml'
      - 'docs/**'
      - 'paper/**'
      - 'examples/**'
      - 'logos/**'
  pull_request:
    branches:
      - "main"
  schedule:
    - cron: "0 9 * * MON"
    - cron: "17 0 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      use_staging:
        description: Test the coordinated MolSysMT/MolSysViewer candidates from staging
        required: true
        default: false
        type: boolean
      molsysmt_version:
        description: Exact staged MolSysMT version when use_staging is true
        required: true
        default: 0.23.0
        type: string
      viewer_version:
        description: Intended Viewer release version for a staged candidate
        required: true
        default: 0.24.1
        type: string
      probe_backlog:
        description: Check skipped-commit debt without running the suite
        required: false
        default: false
        type: boolean

jobs:
  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 0 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to run the full matrix
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/ci_backlog.py --lane ci


  test:
    name: Test on ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    needs: nightly-decision
    if: >-
      !cancelled() && inputs.probe_backlog != true
      && (needs.nightly-decision.result != 'success' || needs.nightly-decision.outputs.run_full == 'true')
      && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      fail-fast: false  # do not cancel all in-progress jobs if any job variation fails
      matrix:
        cfg:
          - { os: ubuntu-latest, python-version: "3.11"}
          - { os: ubuntu-latest, python-version: "3.12"}
          - { os: ubuntu-latest, python-version: "3.13"}
          - { os: ubuntu-latest, python-version: "3.14"}
          - { os: macos-15,  python-version: "3.11"}
          - { os: macos-15,  python-version: "3.12"}
          - { os: macos-15,  python-version: "3.13"}
          - { os: macos-15,  python-version: "3.14"}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.cfg.python-version }}

    - name: Setup conda env
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        environment-file: devtools/conda-envs/test_env.yaml
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
            - ambermd
          channel_priority: strict

        create-args: >-
          python=${{ matrix.cfg.python-version }}
          ${{ inputs.use_staging && '--override-channels --channel uibcdf/label/staging --channel uibcdf --channel conda-forge --channel ambermd' || '' }}
          ${{ inputs.use_staging && format('molsysmt={0}', inputs.molsysmt_version) || '' }}

    - name: Validate and locally tag the staged Viewer candidate
      id: viewer-candidate-tag
      if: github.event_name == 'workflow_dispatch' && inputs.use_staging
      shell: bash -l {0}
      env:
        EXPECTED_VERSION: ${{ inputs.viewer_version }}
      run: |
        set -euo pipefail
        [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python devtools/validate_python_wheel_runtime.py --expected-version "$EXPECTED_VERSION"
        if git show-ref --verify --quiet "refs/tags/$EXPECTED_VERSION"; then
          test "$(git rev-list -n 1 "$EXPECTED_VERSION")" = "$GITHUB_SHA"
        else
          git tag "$EXPECTED_VERSION" HEAD
          echo "created=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Info conda
      shell: bash -l {0}
      run: |
        micromamba activate test
        micromamba info
        micromamba list

    - name: Record published pytest tool versions
      shell: bash -l {0}
      run: |
        python -c "import sys; from importlib.metadata import version; print(sys.version); print('pytest', version('pytest')); print('pytest-receptor', version('pytest-receptor')); assert version('pytest-receptor') == '1.2.0'"

    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps

    - name: Remove the temporary Viewer tag after installation
      if: always() && steps.viewer-candidate-tag.outputs.created == 'true'
      shell: bash -l {0}
      env:
        EXPECTED_VERSION: ${{ inputs.viewer_version }}
      run: |
        set -euo pipefail
        test "$(git rev-list -n 1 "$EXPECTED_VERSION")" = "$GITHUB_SHA"
        git tag -d "$EXPECTED_VERSION"

    - name: Install JS build dependencies for Python distribution tests
      shell: bash -l {0}
      working-directory: molsysviewer/js
      run: npm ci

    - name: Test import module
      shell: bash -l {0}
      run: |
        set -euo pipefail
        echo "::group::Importing module from home directory"
        trap 'echo "::endgroup::"' EXIT
        cd
        pwd
        python -c 'import molsysviewer; print("Version of the package: {}".format(molsysviewer.__version__))'

    - name: Resolve documented Python API calls
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.14'
      shell: bash -l {0}
      run: python scripts/api_resolver.py docs/

    - name: Run tests
      shell: bash -l {0}
      run: |
        # pytest -n logical -v --cov-config=.coveragerc --cov=molsysviewer --cov-report=xml --junitxml=junit.xml --color=yes
        python -m pytest -m "not qt_runtime" -o receptor_rerun_command="python -m pytest" --receptor=ci -v --cov-config=.coveragerc --cov=molsysviewer --cov-report=xml --junitxml=junit.xml --color=yes

    - name: JS unit tests (Node)
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.14'
      shell: bash -l {0}
      run: |
        cd molsysviewer/js
        npm run build
        npm run test:js
        npm run coverage:js

    - name: Check coverage
      shell: bash -l {0}
      run: |
        cat ./coverage.xml
        if [ -f molsysviewer/js/coverage-js/lcov.info ]; then
          echo "JS coverage generated"
        fi

    - name: Upload coverage reports to Codecov
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.14'
      uses: codecov/codecov-action@v4
      with:
        verbose: true
        file: |
          ./coverage.xml
          ./molsysviewer/js/coverage-js/lcov.info
        flags: unittests
        name: codecov-${{ matrix.cfg.os }}-py${{ matrix.cfg.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.14' && ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  pr-gate:
    name: PR full suite
    needs: [test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all core Python and JS jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$TEST_RESULT" = success
