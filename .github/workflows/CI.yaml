name: CI

on:
  # GitHub has started calling new repo's first branch "main" https://github.com/github/renaming
  # Existing codes likely still have "master" as the primary branch
  # Both are tracked here to keep legacy and new codes working
  push:
    branches:
      - "main"
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - '**/*.ipynb'
      - '**/*.yml'
      - '**/*.yaml'
      - 'docs/**'
      - 'paper/**'
      - 'examples/**'
      - 'logos/**'
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - '**/*.ipynb'
      - '**/*.yml'
      - '**/*.yaml'
      - 'docs/**'
      - 'paper/**'
      - 'examples/**'
      - 'logos/**'
  schedule:
    # Nightly tests run on master by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 9 * * MON"
  workflow_dispatch:

jobs:
  qt-pipeline:
    # Runs the two Qt observations that had been reported as impossible without a screen.
    # They are not: under Xvfb with software WebGL both complete, which nobody had tried
    # since the 2026-08-09 attempt to attach to a real display failed on X authorization.
    #
    # **What this establishes and what it does not.** These assert that the Qt pipeline
    # *completes* -- the bridge becomes ready, the payload is served over the custom
    # scheme, and the structure finishes loading through a real WebGL context. Nothing
    # reads the framebuffer. uibcdf/molsysviewer#64 is the standing proof that completion
    # and correctness are different questions: every atom arrived, the load finished, and
    # fifty-nine of sixty protein copies were missing from the picture.
    #
    # So this job does not close Phase 7's item in `devguide/what_needs_a_human_2026_08.md`
    # and must never be recorded as the human observation. It catches a Qt host that is
    # broken outright, which until now nothing did.
    name: Qt pipeline completes (Xvfb, software WebGL)
    if: >
      !(
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]'))
        ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]'))
      )
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup conda env with the Qt stack
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        environment-file: devtools/conda-envs/test_env.yaml
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
            - ambermd
          channel_priority: strict
        create-args: >-
          python=3.13
          pyside6-addons-uibcdf

    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps

    - name: Xvfb and the software GL stack
      shell: bash -l {0}
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgl1 libegl1

    - name: Qt transport round-trip in a real Qt process
      shell: bash -l {0}
      run: |
        xvfb-run -a pytest -k qt_live_model_smoke_real_window -v --no-header

    - name: The structure finishes loading through WebGL
      shell: bash -l {0}
      env:
        MOLSYSVIEWER_QT_GPU_TEST: "1"
        QTWEBENGINE_CHROMIUM_FLAGS: "--use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader"
      run: |
        xvfb-run -a pytest -k full_render_gpu -v --no-header

  test:
    name: Test on ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    if: >
      !(
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ci]'))
        ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]'))
        ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'skip-ci'))
      )
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      fail-fast: false  # do not cancel all in-progress jobs if any job variation fails
      matrix:
        cfg:
          - { os: ubuntu-latest, python-version: "3.11"}
          - { os: ubuntu-latest, python-version: "3.12"}
          - { os: ubuntu-latest, python-version: "3.13"}
          - { os: macos-latest,  python-version: "3.11"}
          - { os: macos-latest,  python-version: "3.12"}
          - { os: macos-latest,  python-version: "3.13"}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.cfg.python-version }}

    - name: Setup conda env
      uses: mamba-org/setup-micromamba@v3.2.1
      with:
        environment-file: devtools/conda-envs/test_env.yaml
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
            - ambermd
          channel_priority: strict

        create-args: >-
          python=${{ matrix.cfg.python-version }}

    - name: Info conda
      shell: bash -l {0}
      run: |
        micromamba activate test
        micromamba info
        micromamba list

    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps

    - name: Test import module
      shell: bash -l {0}
      run: |
        echo "::group::Importing module from home directory"
        cd
        pwd
        echo 'import molsysviewer; print("Version of the package: {}".format(molsysviewer.__version__))' | python
        echo "::endgroup::"

    - name: Resolve documented Python API calls
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.13'
      shell: bash -l {0}
      run: python scripts/api_resolver.py docs/

    - name: Run tests
      shell: bash -l {0}
      run: |
        # pytest -n logical -v --cov-config=.coveragerc --cov=molsysviewer --cov-report=xml --junitxml=junit.xml --color=yes
        pytest -v --cov-config=.coveragerc --cov=molsysviewer --cov-report=xml --junitxml=junit.xml --color=yes

    - name: JS unit tests (Node)
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.13'
      shell: bash -l {0}
      run: |
        cd molsysviewer/js
        npm ci
        npm run build
        npm run test:js
        npm run coverage:js

    - name: Check coverage
      shell: bash -l {0}
      run: |
        cat ./coverage.xml
        if [ -f molsysviewer/js/coverage-js/lcov.info ]; then
          echo "JS coverage generated"
        fi

    - name: Upload coverage reports to Codecov
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.13'
      uses: codecov/codecov-action@v4
      with:
        verbose: true
        file: |
          ./coverage.xml
          ./molsysviewer/js/coverage-js/lcov.info
        flags: unittests
        name: codecov-${{ matrix.cfg.os }}-py${{ matrix.cfg.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.13' && ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
