schema_version: 1
workflows:
  - match:
      path: .github/workflows/CI.yaml
    profile: ci
  - match:
      path: .github/workflows/CI_e2e.yaml
    profile: ci
  - match:
      path: .github/workflows/ruff.yaml
    profile: ci
  - match:
      path: .github/workflows/docs-notebooks.yaml
    profile: docs
  - match:
      path: .github/workflows/sphinx_docs_to_gh_pages.yaml
    profile: docs
  - match:
      path: .github/workflows/npm-publish.yaml
    profile: release
  - match:
      path: .github/workflows/verify-zenodo-release.yaml
    profile: release
  - match:
      path: .github/workflows/build_and_upload_conda_packages.yaml
    profile: conda
    settings:
      package_kind: noarch
