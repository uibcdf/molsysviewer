[build-system]
requires = ["setuptools>=64", "versioningit>=3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molsysviewer"
dynamic = ["version"]
description = "Mol*-powered interactive molecular viewer for Jupyter with reproducible scene state"
authors = [{name = "UIBCDF"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anywidget>=0.9.15",
  "argdigest",
  "depdigest",
  "packaging>=23",
  "pyunitwizard",
  "smonitor",
  "traitlets>=5",
]
license = { text = "MIT" }
keywords = [
  "molecular visualization",
  "molecular viewer",
  "Jupyter",
  "Mol*",
  "structural biology",
  "cheminformatics",
  "MolSysMT",
  "anywidget",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/uibcdf/molsysviewer"
Documentation = "https://www.uibcdf.org/molsysviewer"
Issues = "https://github.com/uibcdf/molsysviewer/issues"

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "pytest-cov",
]
# YAML support for user presets (msv.config.load_user_presets with .yaml files)
yaml = ["pyyaml"]
# Movie export (view.movie.export)
movie = ["imageio"]
# The standalone Qt prototype requires PySide6_uibcdf with QtWebEngineWidgets.
# This is NOT installable via pip — use the UIBCDF conda channel:
#   conda install -c uibcdf -c conda-forge pyside6-addons-uibcdf
standalone = []

[project.scripts]
molsysviewer = "molsysviewer.standalone:main"
molsysviewer-qt = "molsysviewer.standalone_qt:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
namespaces = true
include = ["molsysviewer", "molsysviewer.*"]

[tool.setuptools.package-data]
"molsysviewer" = ["viewer.js"]
"molsysviewer.data" = ["**"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Directories to analyze (adjust if needed).
src = ["molsysviewer", "tests"]

[tool.ruff.lint]
# Base rules (similar to flake8 + import order, etc.)
select = [
  "E",  # style errors (flake8)
  "W",  # style warnings
  "F",  # pyflakes errors
  "I",  # isort (import sorting)
  "B",  # bugbear
]
ignore = [
  "E203",  # keep compatibility with the existing formatted code around slices
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "0.0.0"

[tool.versioningit.write]
file = "molsysviewer/_version.py"
