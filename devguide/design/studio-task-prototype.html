<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio general molecular tools — design prototype</title>
<style>
:root { color-scheme: light; font: 15px/1.5 system-ui, sans-serif; color: #252631; background: #ececf1; }
* { box-sizing: border-box; }
body { margin: 0; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 3px solid #bca8ff; outline-offset: 2px; }
.review-bar { padding: 20px 28px; background: white; border-bottom: 1px solid #d6d7df; }
.review-bar h1 { font-size: 20px; margin: 0 0 5px; font-weight: 650; }
.review-bar p { margin: 0 0 14px; max-width: 90ch; color: #555766; }
.review-tools { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.review-tools label { display: flex; align-items: center; gap: 8px; }
.review-tools select, .review-tools button { background: #fafafe; border: 1px solid #c7c7d4; border-radius: 7px; padding: 6px 10px; color: #303140; }
.prototypes { display: flex; justify-content: center; align-items: flex-start; gap: 24px; padding: 24px; overflow: auto; }
.prototype { flex: 0 0 auto; min-width: 0; }
.prototype > h2 { font-size: 13px; font-weight: 500; color: #626473; margin: 0 0 8px; }
.prototype.hidden { display: none; }
.studio { width: 940px; height: 830px; max-height: calc(100vh - 230px); min-height: 580px; background: #1e1f27; color: #eeedf3; border: 1px solid #444651; border-radius: 13px; display: flex; flex-direction: column; box-shadow: 0 10px 32px #25263422; font-size: 13px; color-scheme: dark; overflow: hidden; }
.narrow .studio { width: 420px; }
.studio-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 17px; border-bottom: 1px solid #3b3c47; gap: 10px; }
.brand { font-size: 16px; font-weight: 650; }
.badge { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid #6b5c92; border-radius: 5px; color: #d5c8f3; padding: 3px 5px; margin-left: 6px; }
.history { display: flex; gap: 6px; }
.studio button { border: 1px solid #50515f; border-radius: 7px; padding: 7px 11px; color: #f0edf7; background: #30313d; line-height: 1.3; }
.studio button:hover:not(:disabled) { background: #414252; }
.studio button.primary { background: #7560ac; border-color: #9e88d2; }
.studio button.primary:hover { background: #846dbd; }
.studio button.quiet { background: transparent; }
.context { padding: 9px 17px; background: #262731; color: #bfc0cc; display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; }
.context strong { color: #ecebf4; font-weight: 500; }
.studio-body { display: flex; flex: 1; min-height: 0; }
.navigation { width: 163px; flex-shrink: 0; border-right: 1px solid #3b3c47; padding: 17px 10px; overflow-y: auto; }
.navigation p { font-size: 10px; letter-spacing: .07em; color: #aba8bc; margin: 0 7px 10px; text-transform: uppercase; }
.navigation button { display: block; width: 100%; text-align: left; border: 0; background: transparent; margin: 2px 0; padding: 8px; }
.navigation button[aria-current="page"] { background: #40374f; color: #e4d7ff; }
.navigation .retained { border-top: 1px solid #3b3c47; padding-top: 15px; margin-top: 18px; font-size: 11px; color: #b6b4c4; }
.navigation .retained summary { cursor: pointer; }
.navigation .retained p { text-transform: none; letter-spacing: 0; margin: 8px 0; line-height: 1.6; }
.editor { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mobile-nav { display: none; padding: 12px 17px 0; }
.narrow .navigation { display: none; }
.narrow .mobile-nav { display: block; }
.panel-heading { padding: 18px 23px 0; }
.panel-heading h2 { font-size: 19px; font-weight: 550; margin: 0 0 4px; }
.panel-heading p { color: #b8b6c7; margin: 0 0 16px; font-size: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid #44424e; }
.studio .tabs button { background: transparent; border: 0; border-radius: 5px 5px 0 0; color: #bcb8ca; padding: 8px 11px 10px; border-bottom: 2px solid transparent; }
.studio .tabs button[aria-selected="true"] { color: #e4d9ff; border-bottom-color: #b49adf; background: #302c3c; }
.panel-content { padding: 20px 23px 30px; overflow: auto; flex: 1; min-height: 0; }
.narrow .panel-heading { padding: 16px 17px 0; }
.narrow .panel-content { padding: 18px 17px 28px; }
.stack { display: grid; gap: 16px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.narrow .split { grid-template-columns: 1fr; }
.studio h3 { font-size: 14px; margin: 0 0 7px; font-weight: 550; }
.studio p { margin-top: 0; }
.hint { font-size: 12px; color: #b8b5c8; margin: 5px 0 0; }
.label { display: block; color: #d1cddc; font-size: 12px; margin-bottom: 5px; }
.studio input:not([type="checkbox"]), .studio select { display: block; width: 100%; min-width: 0; border: 1px solid #555361; border-radius: 6px; background: #282933; color: #f0edf7; padding: 8px 9px; }
.studio input[type="checkbox"] { accent-color: #aa8ad4; width: 16px; height: 16px; flex-shrink: 0; }
.check { display: flex; align-items: flex-start; gap: 10px; border: 1px solid #46434f; border-radius: 8px; padding: 10px; margin: 7px 0; }
.check small { display: block; color: #b6b2c3; margin-top: 2px; }
.box { border: 1px solid #494452; border-radius: 9px; padding: 14px; background: #25252f; }
.note { border-left: 2px solid #a08cbd; padding: 9px 12px; background: #2d2937; color: #d8cfe7; font-size: 12px; margin: 0; }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 3px; }
.review { margin-top: 20px; background: #302a3c; border: 1px solid #8c76b0; border-radius: 9px; padding: 15px; }
.review h3 { color: #e2d3f7; }
.review ul { padding-left: 19px; margin: 9px 0 15px; color: #d4cede; }
.review li { margin: 5px 0; }
.review.stale { border-color: #c3a06e; }
.message { color: #d6c0a2; font-size: 12px; padding: 10px 0; }
.result-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.result-table th, .result-table td { padding: 9px 6px; text-align: left; border-bottom: 1px solid #45414e; }
.result-table th { color: #b9b3c7; font-weight: 500; }
.result-table caption { text-align: left; color: #bfb9cd; padding-bottom: 9px; }
.metric { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #413d4c; }
.chip { display: inline-block; padding: 2px 7px; border-radius: 4px; background: #383145; color: #d5c4ec; font-size: 11px; }
.studio-footer { padding: 9px 17px; border-top: 1px solid #3d3b47; color: #bfb8cc; font-size: 11px; min-height: 35px; }
.empty { color: #c8c3d3; border: 1px dashed #595165; padding: 17px; border-radius: 8px; }
.sequence { color: #b9c8cd; font-family: monospace; letter-spacing: .13em; word-break: break-all; line-height: 2; }
.scope { font-size: 12px; background: #272530; padding: 9px 11px; border-radius: 6px; color: #c9c1d6; }
@media(max-width: 650px) { .review-bar { padding: 15px; } .prototypes { justify-content: flex-start; padding: 14px; } .narrow .studio { width: min(420px, calc(100vw - 28px)); } .review-tools { align-items: flex-start; flex-direction: column; gap: 8px; } }
</style>
</head>
<body>
<header class="review-bar">
  <h1>Studio · general molecular tools</h1>
  <p>Interactive design study. All molecules, counts, reports and results below are illustrative. No MolSysMT calculations, molecular rendering, file writes or actual window synchronization run here.</p>
  <div class="review-tools">
    <label>Layout <select id="layout"><option value="compare">Compare both sizes</option><option value="narrow">Notebook card</option><option value="wide">Wide window</option></select></label>
    <label>Destination scenario <select id="environment"><option value="local">Local</option><option value="remote">Identified remote</option><option value="unknown">Unknown / tunnel</option></select></label>
    <button id="reset">Reset illustrative session</button>
  </div>
</header>
<main class="prototypes" id="prototypes"></main>
<script>
'use strict';
// Presentation prototype only. The toy shared state is NOT a proposed runtime owner,
// scientific data model, persistence format, or recovery implementation.
const panels = {
  system: { title: 'System', description: 'Explore, load and edit the molecular content.', tabs: ['Contents', 'Load', 'Edit'] },
  topology: { title: 'Topology', description: 'Inspect connectivity, chemical assignments and atom correspondence.', tabs: ['Connectivity', 'Chemistry', 'Correspondence'] },
  structure: { title: 'Structure', description: 'Work with coordinates, references and periodic geometry.', tabs: ['Transform', 'Align', 'Analyze', 'PBC'] },
  build: { title: 'Build', description: 'Inspect preparation needs and choose a supported repair.', tabs: ['Inspect', 'Repair', 'Construct'] },
  properties: { title: 'Properties', description: 'Inspect properties and keep scientific results with their context.', tabs: ['Inspect', 'Calculate', 'Results'] },
  interactions: { title: 'Interactions', description: 'Calculate or load analyses, then choose what to display.', tabs: ['Calculate', 'Results', 'Display'] },
  save: { title: 'Save & Export', description: 'Choose the content and the file you want to create.', tabs: ['Molecular system', 'Work', 'Figure'] },
};
const familyOptions = ['Hydrogen bonds', 'Disulfide candidates', 'Ionic contacts', 'Pi–pi interactions', 'Cation–pi interactions', 'Halogen bonds', 'Hydrophobic contacts', 'Metal coordination candidates', 'Water-mediated hydrogen bonds'];
const initial = () => ({ atomIds: Array.from({length: 8002}, (_, i) => i), hydrogens: false, alignmentEdits: 0, box: '8 nm cubic', periodicEdits: 0, results: [], analyses: [], displayed: [] });
let state = initial(), past = [], future = [], generation = 0, status = 'Illustrative ensemble · no scientific engine connected';
const views = [];
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const copy = v => JSON.parse(JSON.stringify(v));
const count = () => state.atomIds.length;
const atomCount = (lo, hi) => state.atomIds.filter(i => i >= lo && i < hi).length;
const options = (values, selected) => values.map(v => `<option${v === selected ? ' selected' : ''}>${esc(v)}</option>`).join('');
function field(v, key, label, values, fallback, help = '') {
  const value = v.draft[key] ?? fallback;
  const id = `${v.narrow ? 'narrow' : 'wide'}-${key}`;
  const accessibility = `aria-labelledby="${id}-label"${help ? ` aria-describedby="${id}-help"` : ''}`;
  return `<label><span class="label" id="${id}-label">${label}</span>${Array.isArray(values)
    ? `<select data-field="${key}" ${accessibility}>${options(values, value)}</select>`
    : `<input data-field="${key}" ${accessibility} value="${esc(value)}" ${values || ''}>`}${help ? `<span class="hint" id="${id}-help">${help}</span>` : ''}</label>`;
}
function check(v, key, label, help = '') {
  return `<label class="check"><input type="checkbox" data-field="${key}"${v.draft[key] ? ' checked' : ''}><span>${label}${help ? `<small>${help}</small>` : ''}</span></label>`;
}
const button = (action, label, primary = false) => `<button data-action="${action}"${primary ? ' class="primary"' : ''}>${label}</button>`;
const preview = (action, label = 'Review change') => `<div class="actions">${button(action, label, true)}</div><p class="hint">This prototype will only simulate the reviewed outcome.</p>`;
const frames = v => field(v, 'frames', 'Structures', ['Current · index 0', 'All · 12 structures', 'Indices · 0, 8, 3'], 'Current · index 0');
const target = v => field(v, 'target', 'Atoms', ['Protein · source A', 'Active selection · 100 atoms', 'Whole system'], 'Protein · source A');
const frameList = v => (v.draft.frames ?? 'Current · index 0').startsWith('Indices') ? [0, 8, 3] : (v.draft.frames ?? '').startsWith('All') ? Array.from({length: 12}, (_, i) => i) : [0];
function resolveEditSelection(v) {
  const mode = v.draft.editSelectionMode ?? 'Active selection';
  let ids = [], description = mode, error = '';
  if (mode === 'Whole system') ids = state.atomIds.slice();
  if (mode === 'Active selection') ids = state.atomIds.filter(i => i < 100);
  if (mode === 'Saved selection') { ids = state.atomIds.filter(i => i >= 100 && i < 200); description = 'Saved selection · protein example'; }
  if (mode === 'Region or source') {
    const protein = (v.draft.editSource ?? 'Source A · protein').startsWith('Source A');
    ids = state.atomIds.filter(i => protein ? i < 6200 : i >= 6200);
    description = v.draft.editSource ?? 'Source A · protein';
  }
  if (mode === 'Chain or group') {
    const group = (v.draft.editGroup ?? 'Chain A · illustrative').startsWith('Group');
    ids = state.atomIds.filter(i => group ? i >= 120 && i < 130 : i < 3100);
    description = v.draft.editGroup ?? 'Chain A · illustrative';
  }
  if (mode === 'Molecular categories') {
    ids = state.atomIds.filter(i => (v.draft.water && i >= 6200 && i < 8000) || (v.draft.sodium && i === 8000) || (v.draft.magnesium && i === 8001));
    description = ['water','sodium','magnesium'].filter(k => v.draft[k]).join(' + ') || 'No category selected';
  }
  if (mode === 'Atom indices') {
    const raw = (v.draft.editIndices ?? '0, 8, 3').trim();
    if (raw && !/^\d+(\s*,\s*\d+)*$/.test(raw)) error = 'Enter nonnegative atom indices separated by commas.';
    else {
      const indices = raw ? [...new Set(raw.split(',').map(Number))] : [];
      if (indices.some(i => !Number.isSafeInteger(i) || i >= count())) error = 'An atom index is outside the current example system.';
      else ids = indices.map(i => state.atomIds[i]);
    }
    description = `Current atom indices: ${raw || '(empty)'}`;
  }
  if (mode === 'Selection expression') return {ids: [], description: 'Expression requires the provider selector', unresolved: true};
  return {ids, description, error};
}
function editSelectionForm(v) {
  const mode = v.draft.editSelectionMode ?? 'Active selection';
  let detail = '';
  if (mode === 'Molecular categories') detail = `<div><p class="hint">Choose categories or individual ions. Nothing is selected as dispensable automatically.</p>
    ${check(v, 'water', `Water · ${atomCount(6200,8000).toLocaleString('en-US')} atoms`, 'Source B · illustrative classification')}
    ${check(v, 'sodium', `Sodium · ${atomCount(8000,8001)} atom`, 'Source B · inspect its role before removal')}
    ${check(v, 'magnesium', `Magnesium · ${atomCount(8001,8002)} atom`, 'Source B · individual optional inclusion')}</div>`;
  if (mode === 'Region or source') detail = field(v, 'editSource', 'Region or source', ['Source A · protein', 'Source B · solvent and ions'], 'Source A · protein');
  if (mode === 'Chain or group') detail = field(v, 'editGroup', 'Chain or group', ['Chain A · illustrative', 'Group A:10 · illustrative'], 'Chain A · illustrative');
  if (mode === 'Saved selection') detail = '<div class="scope">Saved selection: protein example · original example atoms 100–199.</div>';
  if (mode === 'Active selection') detail = '<div class="scope">Active selection: surviving atoms from the example’s first 100 protein atoms. The real product uses the existing mouse-selection owner.</div>';
  if (mode === 'Atom indices') detail = field(v, 'editIndices', 'Atom indices', '', '0, 8, 3', 'Zero-based indices of the current atom axis; independent of structure indices.');
  if (mode === 'Selection expression') detail = field(v, 'editExpression', 'MolSysMT selection expression', '', "molecule_type=='water'", 'The product evaluates expressions through MolSysMT. This offline mockup intentionally does not implement a selection language.');
  return `${field(v, 'editSelectionMode', 'Select atoms by', ['Active selection', 'Saved selection', 'Region or source', 'Chain or group', 'Molecular categories', 'Atom indices', 'Selection expression', 'Whole system'], 'Active selection')}${detail}`;
}
function seriesForm(v, geometry) {
  return `<div class="stack"><h3>${geometry ? 'Radius of gyration' : 'Solvent-accessible surface area'}</h3>${target(v)}${frames(v)}
    ${field(v, geometry ? 'geometryResultName' : 'propertyResultName', 'Result name', '', geometry ? 'protein-size' : 'protein-sasa')}
    <details open><summary>Scientific definition</summary><p class="hint">${geometry ? 'Equal geometric weights; mass weighting is a separate explicit choice. This example does not apply mass weighting.' : 'Whole-system occlusion before filtering the selected output. The native engine uses supplied boxes; method, probe, sampling and box context must be retained with the result.'}</p></details>
    ${preview('review-property', 'Review calculation')}</div>`;
}
function resultTable(result) {
  return `<div class="box"><h3>${esc(result.name)} <span class="chip">illustrative</span></h3>
    <p class="hint">${esc(result.method)} · ${esc(result.scope)} · ${result.valid ? 'Associated with current input' : 'Historical input · not projected onto current atoms'}</p>
    <table class="result-table"><caption>Values demonstrate indexing only; they are not calculated.</caption><thead><tr><th scope="col">Structure index</th><th scope="col">${esc(result.unit)}</th></tr></thead><tbody>${result.frames.map((f, i) => `<tr><td>${f}</td><td>${(2.10 + i * .07).toFixed(2)}</td></tr>`).join('')}</tbody></table>
    <p class="hint">Unqueried structures have no value. No zero filling or interpolation is implied.</p></div>`;
}
function renderContent(v) {
  const tab = v.tab;
  if (v.panel === 'system' && tab === 'Contents') return `<div class="stack">
    <div class="box"><h3>Ensemble A <span class="chip">example data</span></h3><div class="metric"><span>Atoms</span><strong>${count().toLocaleString('en-US')}</strong></div><div class="metric"><span>Structures</span><strong>12</strong></div><div class="metric"><span>Sources</span><strong>A · protein / B · solvent</strong></div><p class="hint">The example is not an inventory of PDB 1TCD.</p></div>
    <div><h3>Molecular hierarchy</h3><details open class="box"><summary>Source A · protein · 2 chains</summary><details open><summary>Chain A · groups</summary><div class="sequence">APRKFFVGGNWKMNGDKKSL</div><p class="hint">Sequence, hierarchy, selection and contextual actions remain here. This excerpt is an illustrative sequence strip.</p></details></details>
    <details class="box"><summary>Source B · solvent and ions</summary><p class="hint">Water: ${atomCount(6200,8000)} atoms · sodium: ${atomCount(8000,8001)} atom · magnesium: ${atomCount(8001,8002)} atom</p></details></div>
    <div class="actions">${button('go-remove', 'Edit molecular content…')}${button('shortcut-water', 'Select waters for removal…')}${button('go-save', 'Save molecular system…')}</div></div>`;
  if (v.panel === 'system' && tab === 'Load') return `<div class="stack">
    ${field(v, 'sourceKind', 'Source', ['PDB identifier', 'Browser file', 'Python host path'], 'PDB identifier')}
    ${field(v, 'source', 'Identifier or source description', '', '1TCD', 'Browser file selection and host paths are distinct inputs; this prototype accepts descriptive text only.')}
    ${field(v, 'loadMode', 'Load as', ['Add an independent system', 'Replace the current system', 'Append compatible structures'], 'Add an independent system')}
    <p class="note">Independent sources become one molecular system with a source region each. Structure compatibility, box policy and attribute losses need explicit validation.</p>
    <div class="box"><h3>Several sources</h3><p class="hint">The same task will accept a source list, including mixed formats. It must not infer trajectory concatenation from a list of independent molecules.</p></div>
    ${button('explain-load', 'Review loading contract')}</div>`;
  if (v.panel === 'system' && tab === 'Edit') return `<div class="stack">
    ${field(v, 'edit', 'Operation', ['Remove atoms', 'Keep selected atoms'], 'Remove atoms')}
    ${editSelectionForm(v)}
    <div class="scope">Atom-domain edits apply across all 12 structures. Visibility does not select atoms for deletion.</div>
    <p class="hint">Water, a protein group and arbitrary indices use the same operation. Review captures the target against this revision.</p>
    ${preview('review-remove')}</div>`;
  if (v.panel === 'build' && tab === 'Inspect') return `<div class="stack">${target(v)}${field(v, 'state', 'Chemical state', ['Reference state', 'Choose a declared state…'], 'Reference state')}${field(v, 'inspectFrame', 'Structure for inspection', ['Current · index 0'], 'Current · index 0')}
    <div class="box"><h3>Preparation report <span class="chip">illustrative</span></h3><div class="metric"><span>Connectivity</span><span>Present</span></div><div class="metric"><span>Explicit hydrogens</span><span>${state.hydrogens ? 'Added in this example' : 'Partial'}</span></div><div class="metric"><span>Formal charges</span><span>Unassessed</span></div><p class="hint">Inspection distinguishes present, missing, conflicting and unassessed information. It does not certify universal chemical readiness.</p></div>
    ${button('go-repair', 'Review hydrogen preparation…')}</div>`;
  if (v.panel === 'build' && tab === 'Repair') return `<div class="stack">
    <h3>Add missing hydrogens</h3><p class="hint">One explicit scientific operation. It does not also remove conflicting H, normalize chemistry or minimize coordinates.</p>
    ${field(v, 'repair', 'Preparation route', ['Protein · supported pH rules', 'Isolated ligand · declared chemical state'], 'Protein · supported pH rules')}
    ${(v.draft.repair ?? '').startsWith('Isolated') ? `${field(v, 'ligandState', 'Declared chemical state', ['Reference state'], 'Reference state')}<div class="scope">Engine: RDKit · fixed chemical state. One isolated component and one structure; pH is not used.</div>` : `${field(v, 'pH', 'Protein target pH', 'type="number" min="0" max="14" step="0.1"', '7.4')}${field(v, 'engine', 'Engine', ['MolSysMT · protein templates', 'OpenMM · optional protein route'], 'MolSysMT · protein templates')}`}
    <div class="note">Protein rules use supported templates and pKa approximations. Adding missing H does not remove conflicting H automatically. Fixed-state ligand placement requires one isolated component, one structure and complete chemical assignments.</div>
    <div class="scope">This example has 12 structures. A one-structure repair cannot silently add atoms to every structure; review a supported all-structure route or create a separate one-structure system.</div>
    ${preview('review-hydrogens', 'Review prerequisites')}</div>`;
  if (v.panel === 'build' && tab === 'Construct') return `<div class="stack"><h3>Construction workflow review</h3><p>Solvation, supported native construction and reconstruction remain in the operation inventory.</p><p class="note">No universal builder is implied by the Build panel. Each route needs its own chemistry, box, engine, atom mapping and recovery contract.</p>${button('go-inspect', 'Start with inspection')}</div>`;
  if (v.panel === 'topology') return `<div class="stack">
    ${target(v)}${field(v, 'state', 'Chemical state', ['Reference state'], 'Reference state')}
    <div class="box"><h3>${tab === 'Connectivity' ? 'Declared bonds and connected components' : tab === 'Chemistry' ? 'Chemical assignments and coverage' : 'Atom correspondence'}</h3>
      <p class="hint">${tab === 'Connectivity' ? 'Inspect atom/group identity, bond order and connected components. A geometric contact is not an assigned covalent bond.' : tab === 'Chemistry' ? 'Read charges, aromaticity, valence and H inventory with declared/missing/unassessed coverage.' : 'Map explicit moving/reference atom populations. Equal counts alone do not establish identity; ambiguous matches need a decision.'}</p></div>
    ${button(tab === 'Chemistry' ? 'go-inspect' : 'go-align', tab === 'Chemistry' ? 'Open preparation inspection…' : 'Open coordinate alignment…')}
    <p class="hint">This mockup reviews the handoff. Graph and chemistry editors need their own detailed prototypes.</p></div>`;
  if (v.panel === 'structure' && tab === 'Align') return `<div class="stack">
    ${field(v, 'moving', 'Coordinates to move', ['Whole system', 'Protein · source A', 'Active selection · 100 atoms'], 'Whole system')}
    <div class="split">${field(v, 'fit', 'Atoms used to fit', ['Matched protein backbone', 'Matched active selection'], 'Matched protein backbone')}${field(v, 'reference', 'Reference', ['Source A · structure 0', 'Choose another loaded source…'], 'Source A · structure 0')}</div>
    ${frames(v)}
    <div class="box"><h3>Correspondence</h3><p class="hint">Example: 180 matched backbone atoms; ordered pairs established before fitting. At least three noncollinear anchors are required in both inputs.</p></div>
    <p class="note">Fitting atoms and moving atoms are different scopes. Alignment changes coordinates; it is not merely a camera operation.</p>${preview('review-align')}</div>`;
  if (v.panel === 'structure' && tab === 'PBC') return `<div class="stack">
    ${field(v, 'pbcAction', 'Action', ['Assign a periodic box', 'Wrap connected components', 'Unwrap a trajectory'], 'Assign a periodic box')}
    ${frames(v)}${field(v, 'box', 'Box source / demonstration', ['Three row vectors · nm', 'Another loaded source', 'Supported box file'], 'Three row vectors · nm')}
    <div class="box"><h3>Box vectors in this example · nm</h3><p class="hint">a = (6, 0, 0)<br>b = (0, 6, 0)<br>c = (0, 0, 6)</p></div>
    <p class="note">Assigning a box does not move atoms. Wrapping moves coordinates. Temporal unwrapping does not reconstruct a molecule split within one frame.</p>${preview('review-pbc')}</div>`;
