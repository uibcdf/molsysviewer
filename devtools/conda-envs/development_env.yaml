channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python=3.13
  - pip
  - versioningit

  # --- Jupyter / widget development ---
  - jupyterlab
  - ipywidgets
  - anywidget

  # --- Scientific stack (lightweight) ---
  - numpy
  - pandas
  - molsysmt
  - pyunitwizard

  # --- Dev tools: formatting, linting, testing ---
  - ruff=0.16.5
  - pytest
  - pytest-receptor ==1.2.0
  - pytest-cov

  # --- Optional but helpful for interactive debugging ---
  - jupyterlab_code_formatter
  - jupyterlab_git

  # --- NodeJS for JS development and esbuild ---
  - nodejs>=18

  # --- Qt standalone stack (conda-forge) ---
  # Keep the Python binding and Qt WebEngine runtime on the same version.
  - pyside6 ==6.11.2
  - qt6-webengine ==6.11.2
  - qt6-positioning ==6.11.2

  # --- Documentation with Sphinx and MyST ---
  - jupyterlab
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-remove-toctrees
  - sphinx-copybutton
  - sphinx-design
  - sphinx-favicon
  - pydata-sphinx-theme
  - myst-nb
