channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python=3.13
  - pip
  - versioningit

  # --- Jupyter / widget development ---
  - jupyterlab
  - ipywidgets
  - anywidget

  # --- Scientific stack (lightweight) ---
  - numpy
  - pandas
  - molsysmt
  - pyunitwizard

  # --- Dev tools: formatting, linting, testing ---
  - black
  - ruff
  - pytest
  - pytest-cov

  # --- Optional but helpful for interactive debugging ---
  - jupyterlab_code_formatter
  - jupyterlab_git

  # --- NodeJS for JS development and esbuild ---
  - nodejs>=18

  # --- Qt standalone stack (UIBCDF channel) ---
  # Provides PySide6_uibcdf with QtWebEngineWidgets for the standalone Qt prototype.
  # Requires the uibcdf channel (listed above).
  - pyside6-addons-uibcdf ==6.9.2

  # --- Documentation with Sphinx and MyST ---
  - jupyterlab
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-remove-toctrees
  - sphinx-copybutton
  - sphinx-design
  - sphinx-favicon
  - pydata-sphinx-theme
  - myst-nb
