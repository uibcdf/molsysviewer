channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python=3.12
  - pip
  - versioningit

  # --- Jupyter / widget development ---
  - jupyterlab
  - ipywidgets
  - anywidget

  # --- Scientific stack (lightweight) ---
  - numpy
  - pandas
  - molsysmt
  - pyunitwizard

  # --- Dev tools: formatting, linting, testing ---
  - black
  - ruff
  - pytest
  - pytest-cov

  # --- Optional but helpful for interactive debugging ---
  - jupyterlab_code_formatter
  - jupyterlab_git

  # --- NodeJS for JS development and esbuild ---
  - nodejs>=18

  # --- Optional: base Qt package only.
  # The currently supported standalone Qt spike recipe itself is documented in:
  # devguide/standalone_supported_environment.md
  # Keep the main env conservative; use a derived Qt-spike env for coherent
  # PySide6 + QtWebEngine work.
  - pyside6

  # --- Documentation with Sphinx and MyST ---
  - jupyterlab
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-remove-toctrees
  - sphinx-copybutton
  - sphinx-design
  - sphinx-favicon
  - sphinx-tabs
  - pydata-sphinx-theme
  - myst-nb
  - pip:
      # Do not treat this as the final supported standalone recipe by itself.
      # See devguide/standalone_supported_environment.md.
      - PySide6-Addons
