channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python=3.12
  - pip
  - versioningit

  # --- Jupyter / widget development ---
  - jupyterlab
  - ipywidgets
  - anywidget

  # --- Scientific stack (lightweight) ---
  - numpy
  - pandas
  - molsysmt
  - pyunitwizard

  # --- Dev tools: formatting, linting, testing ---
  - black
  - ruff
  - pytest
  - pytest-cov

  # --- Optional but helpful for interactive debugging ---
  - jupyterlab_code_formatter
  - jupyterlab_git

  # --- NodeJS for JS development and esbuild ---
  - nodejs>=18

  # --- Optional: final-standalone prototyping (Qt host shell) ---
  - pyside6

  # --- Documentation with Sphinx and MyST ---
  - jupyterlab
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-remove-toctrees
  - sphinx-copybutton
  - sphinx-design
  - sphinx-favicon
  - sphinx-tabs
  - pydata-sphinx-theme
  - myst-nb
  - pip:
      # Keep Qt WebEngine available for the standalone Qt prototype when the
      # conda-forge pyside6 build does not expose PySide6.QtWebEngineWidgets.
      - PySide6-Addons
