channels:
  - uibcdf
  - conda-forge
  - ambermd

dependencies:
  - python>=3.11,<3.15
  - pip
  - python-build
  - setuptools>=77.0.3
  - versioningit
  - wheel
  - pytest
  - pytest-receptor ==1.2.0
  - pytest-cov
  # Actual widget/kernel/browser receiving for live work-file capture (#319).
  - jupyterlab
  - ipykernel
  - psutil
  # The distribution-contract tests parse the Conda YAML recipe during collection.
  - pyyaml>=6.0
  # Runtime dependencies, with the floors pyproject.toml declares. The package is
  # installed with --no-deps, so this list is the only thing that brings them in;
  # tests/test_distribution_artifact.py keeps the two in step.
  - aiohttp>=3.10
  - anywidget>=0.9.15
  - argdigest>=0.13.0
  - depdigest>=0.12.0
  - molsysmt>=0.23.0
  - numpy>=1.26
  - packaging>=23
  - pyunitwizard>=0.25.0
  - smonitor>=0.13.0
  - traitlets>=5
  # Public MolSysMT 0.23.0 predates its #431 Pandas 3.1 warning-strict repair.
  # Keep this received CI baseline until the repaired package is public;
  # current-source receiving selects Pandas separately. Not a runtime bound.
  # Owner/removal: devguide/public_provider_ci_compatibility_20261104.md (#294).
  - pandas==2.3.3
  - imageio>=2.16.0
  # Node 26 currently breaks the bundled JS coverage tool's CommonJS loader.
  - nodejs>=22,<23
  # Test-only requirements: the README exercises an MDTraj input and the
  # information-table tests render Pandas Styler HTML.
  - mdtraj
  - jinja2
  # Real interaction-family fixtures construct molecular topology with RDKit.
  - rdkit
  # The complementary AMBER prmtop/inpcrd fixture uses MolSysMT's OpenMM forms.
  - openmm
