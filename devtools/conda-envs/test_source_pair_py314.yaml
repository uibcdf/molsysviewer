channels:
  - uibcdf
  - conda-forge

dependencies:
  - python=3.14
  - pip
  - setuptools>=77.0.3
  - setuptools-rust>=1.10
  - versioningit>=3
  - wheel
  - python-build
  - pytest
  - pytest-receptor ==1.2.0
  - pytest-cov
  - pyyaml>=6.0
  # Execute every documented notebook against this same exact source pair.
  - nbconvert
  - ipykernel
  # Actual widget/kernel/browser diagnostics share the same source provider (#319).
  - jupyterlab
  - psutil
  - nodejs>=22,<23
  - h5py
  - numpy>=1.26,<3
  - pandas
  - networkx
  - tqdm
  - matplotlib
  - py-mmcif>=1.1.1
  - argdigest>=0.13.0
  - depdigest>=0.12.0
  # Floors declared by the exact MolSysMT source candidate.
  - smonitor>=0.16.0
  - pyunitwizard>=0.28.1
  - aiohttp>=3.10
  - anywidget>=0.9.15
  - packaging>=23
  - traitlets>=5
  - imageio>=2.16.0
  - imageio-ffmpeg>=0.6.0
  - jinja2
  - mdtraj
  - biopython
  # Real interaction-family fixtures construct molecular topology with RDKit.
  - rdkit
  # The complementary AMBER prmtop/inpcrd fixture uses MolSysMT's OpenMM forms.
  - openmm
