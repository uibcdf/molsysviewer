channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python=3.13
  - pip

  # --- Jupyter / widget development ---
  - jupyterlab
  - ipywidgets

  # --- Runtime dependencies, with the floors pyproject.toml declares ---
  # The package is installed with --no-deps, so this list is the only thing that brings
  # them in; tests/test_distribution_artifact.py keeps the two in step.
  - aiohttp>=3.10
  - anywidget>=0.9.15
  - argdigest>=0.13.0
  - depdigest
  - molsysmt>=0.22.0
  - numpy
  - packaging>=23
  - pyunitwizard
  - smonitor>=0.13.0
  - traitlets>=5

  # --- Scientific stack (lightweight) ---
  - pandas

  # --- Documentation with Sphinx and MyST ---
  - jupyterlab-myst
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-remove-toctrees
  - sphinx-copybutton
  - sphinx-design
  - sphinx-favicon
  - pydata-sphinx-theme
  - myst-nb
