channels:
  - uibcdf
  - conda-forge

dependencies:
  # Core tools for building and uploading conda packages
  - conda-build
  - anaconda-client
  - versioningit

  # Needed to build the JS bundle (viewer.js) during conda build
  - nodejs>=22,<23

  # Python packaging helpers
  - pip
  - python-build
  - setuptools>=77.0.3
  - wheel
  # Metadata-only dependency audit, before wheel or Conda builds.
  - packaging>=23
  - pyyaml
