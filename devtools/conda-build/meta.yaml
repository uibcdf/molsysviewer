package:
  name: molsysviewer
  version: "{{ environ['GIT_DESCRIBE_TAG'] }}"

source:
  path: ../../   # repo root (adjust if your layout differs)

build:
  number: 1

requirements:
  host:
    - python
    - pip
    - setuptools >=64
    - versioningit >=3
    - wheel
    - nodejs  # for npm and building viewer.js
  run:
    - python
    - anywidget >=0.9.15
    - argdigest >=0.12.1
    - depdigest
    - molsysmt >=0.22.0
    - numpy
    - packaging >=23
    - pyunitwizard
    - smonitor >=0.13.0
    - traitlets >=5

test:
  imports:
    - molsysviewer
    - molsysviewer.runtime_contract
  commands:
    - python -c "from importlib.resources import files; assert files('molsysviewer').joinpath('runtime_actions.json').is_file()"

about:
  home: "https://github.com/uibcdf/molsysviewer"
  license: "MIT"  # adjust if needed
  summary: "Molecular viewer based on Mol* and anywidget."
